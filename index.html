<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zamzam Rider Orders</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#14532d;overflow:hidden}
  iframe{display:block;width:100%;height:100dvh;border:0}
  #wait{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        color:#fff;font-family:sans-serif;font-size:18px;background:#14532d;z-index:2}
</style>
</head>
<body>
<div id="wait">Zamzam Rider Orders — Loading…</div>
<iframe id="app" title="Zamzam Rider Orders"></iframe>
<script>
  var base = "https://script.google.com/macros/s/AKfycbwS6Ntx1GWDcOZh8WCiG0uME9Mjs96wHwbvNj9wU3WNG1e9zF-HURF3ClvYh7HT-g1Thg/exec";
  var q = window.location.search || "";
  document.getElementById('app').src = base + q;
  document.getElementById('app').addEventListener('load', function(){
    setTimeout(function(){ document.getElementById('wait').style.display='none'; }, 400);
  });
</script>
</body>
</html>
